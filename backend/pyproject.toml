[project]
name = "ai-issue-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for an AI-integrated issue tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "sentence-transformers>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

